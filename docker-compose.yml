# Infraestructura local de AssetDesk.
#
# Etapa 1 solo levanta la base de datos. La API se corre con `dotnet run` para poder
# iterar rapido; se contenedoriza mas adelante, cuando tenga que compartir red con
# Prometheus.
#
# Requiere un archivo .env al lado de este. Copialo de .env.example:
#   cp .env.example .env

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: assetdesk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?falta MSSQL_SA_PASSWORD en el archivo .env}
      # Edicion Developer: gratis para desarrollo y pruebas, no para produccion.
      MSSQL_PID: Developer
    ports:
      # 1433 solo en loopback: la base no queda expuesta a la red local.
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # -C confia en el certificado autofirmado del contenedor. Sin esto sqlcmd 18 falla.
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
        -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  mssql-data:
